<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MG Studio · 作品预览</title>
<style>
@font-face{font-family:StudioSans;src:url('./assets/NotoSansSC.ttf') format('truetype');font-weight:100 900;font-display:block}
*{box-sizing:border-box}body{margin:0;background:#141821;color:#fff;font:14px system-ui}
main{min-height:100vh;display:grid;place-content:center;gap:18px;padding:28px}
#frame{position:relative;box-shadow:0 16px 60px #0006;overflow:hidden}
canvas#stage{display:block;max-width:92vw;max-height:80vh;width:auto;height:auto}
div#stage{position:absolute;left:0;top:0;overflow:hidden;transform-origin:0 0;font-family:StudioSans}
nav{display:flex;gap:16px;align-items:center}input{flex:1;accent-color:#b7ff6b}
button{background:#b7ff6b;color:#132028;border:0;border-radius:24px;padding:10px 22px;cursor:pointer}
body.render main{padding:0;display:block;min-height:0}body.render #frame{box-shadow:none}body.render canvas#stage{max-width:none;max-height:none}body.render nav{display:none}
/* Render mode: nothing may move unless seek(t) moves it. */
body.render *,body.render *::before,body.render *::after{animation:none!important;transition:none!important;caret-color:transparent!important}
</style>
<main><div id="frame"></div><nav><button id="play">播放</button><input id="time" aria-label="播放进度" type="range" min="0" step="0.01"><span id="readout"></span></nav></main>
<!-- Bare specifiers for optional local packages (npm i three). Unused entries cost nothing. -->
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import {createFilm} from './src/film.js';
const cfg=await fetch('./film.json').then(r=>r.json());
const q=new URLSearchParams(location.search);
const size=(q.get('size')||`${cfg.width}x${cfg.height}`).split('x').map(Number);
const render=q.has('render');if(render)document.body.classList.add('render');
const capture=cfg.capture||'canvas';
if(!['canvas','dom'].includes(capture))throw Error(`Unknown capture mode: ${capture}`);
const frameEl=document.querySelector('#frame');
let stage;
if(capture==='canvas'){
  stage=document.createElement('canvas');stage.id='stage';[stage.width,stage.height]=size;frameEl.append(stage);
}else{
  stage=document.createElement('div');stage.id='stage';stage.style.width=size[0]+'px';stage.style.height=size[1]+'px';frameEl.append(stage);
  const fit=()=>{const s=render?1:Math.min(1,innerWidth*.92/size[0],innerHeight*.8/size[1]);stage.style.transform=`scale(${s})`;frameEl.style.width=size[0]*s+'px';frameEl.style.height=size[1]*s+'px';};
  fit();if(!render)addEventListener('resize',fit);
}
// Fonts: the bundled StudioSans plus any project-local families declared in film.json "fonts".
// Every declared face must really load; a silent system fallback is a failure, not a pass.
const fontSample='中文愿望光0123456789'+(cfg.title||'');
for(const f of cfg.fonts||[]){
  if(!f.family||!(f.src||f.local))throw Error('fonts[] entries need family and src (project file) or local (installed font name)');
  if(f.local){
    // Installed (system) font used by its family name. Proven present by metric difference against two fallbacks.
    const m=document.createElement('canvas').getContext('2d'),probe='Hamburgefonstiv 0123 中文字形测试';
    const differs=['monospace','serif'].every(fb=>{m.font=`64px ${fb}`;const a=m.measureText(probe).width;m.font=`64px "${f.family}", ${fb}`;return Math.abs(m.measureText(probe).width-a)>0.5;});
    if(!differs)throw Error(`Installed font "${f.family}" not found on this machine; fallback is not accepted`);
    continue;
  }
  const url=new URL(f.src,document.baseURI);
  if(url.protocol!=='data:'&&url.origin!==location.origin)throw Error(`Font ${f.family} must be a project-local file`);
  const face=new FontFace(f.family,`url(${url.href})`,{weight:f.weight||'100 900',style:f.style||'normal'});
  try{await face.load();}catch(e){throw Error(`Font ${f.family} failed to load from ${f.src}`);}
  document.fonts.add(face);
}
const families=[['StudioSans',[400,500,600,700,800,900]],...(cfg.fonts||[]).filter(f=>!f.local).map(f=>[f.family,f.check||[400]])];
for(const [family,weights] of families)for(const weight of weights){
  const ok=(await document.fonts.load(`${weight} 64px "${family}"`,fontSample)).some(x=>x.family.replace(/["']/g,'')===family&&x.status==='loaded');
  if(!ok)throw Error(`${family} ${weight} missing; fallback is not accepted`);
}
await document.fonts.ready;
const film=await createFilm(stage,cfg);
window.MG={...cfg,capture,width:size[0],height:size[1],seek:film.seek,inspect:film.inspect,trace:film.trace,layoutCoverage:film.layoutCoverage||'instrumented text bounds only',ready:true};
await film.seek(0);
if(!render){
  const slider=document.querySelector('#time'),btn=document.querySelector('#play'),readout=document.querySelector('#readout');
  const silent=cfg.audio?.mode==='silent',audio=silent?null:new Audio('./out/score.wav');
  if(audio)audio.loop=cfg.loop===true;
  slider.max=cfg.duration-1/cfg.fps;let playing=false,pos=0,basePosition=0,startedAt=0;
  const show=()=>{slider.value=pos;readout.textContent=`${pos.toFixed(2)} / ${cfg.duration}s${silent?' · 静音'+(cfg.loop?'循环':''):''}`;film.seek(pos);};
  slider.oninput=()=>{pos=Number(slider.value);if(audio)audio.currentTime=pos;basePosition=pos;startedAt=performance.now();show();};
  btn.onclick=async()=>{
    if(playing){playing=false;audio?.pause();btn.textContent='播放';return;}
    if(pos>=cfg.duration-1/cfg.fps)pos=0;
    if(silent){basePosition=pos;startedAt=performance.now();playing=true;btn.textContent='暂停';}
    else{audio.currentTime=pos;try{await audio.play();playing=true;btn.textContent='暂停';}catch(e){playing=false;readout.textContent=`音轨无法播放：${e.message}`;}}
  };
  if(audio)audio.onended=()=>{playing=false;pos=cfg.duration-1/cfg.fps;btn.textContent='重播';show();};
  function live(){if(playing){
    if(silent){const elapsed=basePosition+(performance.now()-startedAt)/1000;pos=cfg.loop?elapsed%cfg.duration:Math.min(elapsed,cfg.duration-1/cfg.fps);if(!cfg.loop&&elapsed>=cfg.duration){playing=false;btn.textContent='重播';}}
    else pos=Math.min(audio.currentTime,cfg.duration-1/cfg.fps);
    show();}requestAnimationFrame(live);}
  show();requestAnimationFrame(live);
}
</script>
</html>
